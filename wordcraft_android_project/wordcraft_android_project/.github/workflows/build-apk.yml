name: Universal Android Signed Release APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore if missing
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            keytool -genkeypair -v               -keystore app/release-key.jks               -alias wordcraft               -keyalg RSA -keysize 2048 -validity 10000               -storepass wordcraft -keypass wordcraft               -dname "CN=WordCraft, OU=OpenSource, O=ArtCraft, L=Osterhofen, S=BY, C=DE"
          fi

      - name: Build Signed Universal Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-universal-release-apk
          path: app/build/outputs/apk/release/*.apk
